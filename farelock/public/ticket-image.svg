<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Ground: near-black with a cool glow behind the prism -->
    <radialGradient id="glow" cx="0.62" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#1b1830"/>
      <stop offset="0.55" stop-color="#0d0c14"/>
      <stop offset="1" stop-color="#070709"/>
    </radialGradient>

    <!-- Holographic sheen laid over everything -->
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3d6e" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#ff3d6e" stop-opacity="0.16"/>
      <stop offset="0.32" stop-color="#ffbf00" stop-opacity="0.12"/>
      <stop offset="0.46" stop-color="#3dffb0" stop-opacity="0.12"/>
      <stop offset="0.6" stop-color="#3db8ff" stop-opacity="0.16"/>
      <stop offset="0.74" stop-color="#9b5cff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#9b5cff" stop-opacity="0"/>
    </linearGradient>

    <!-- Glass body of the prism -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#bfd8ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>

    <!-- The incoming white beam, brightest where it meets the prism -->
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Each colour band fades out as it fans away -->
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.15"/>
    </linearGradient>
    <mask id="fadeMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="760">
      <rect x="640" y="0" width="560" height="760" fill="url(#fade)"/>
    </mask>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <!-- Film grain -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.08"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#glow)"/>

  <!-- Large soft colour washes behind the scene -->
  <g filter="url(#bloom)" style="mix-blend-mode:screen" opacity="0.55">
    <ellipse cx="930" cy="170" rx="260" ry="140" fill="#3db8ff" opacity="0.35"/>
    <ellipse cx="1010" cy="420" rx="240" ry="150" fill="#ff3d6e" opacity="0.3"/>
    <ellipse cx="640" cy="260" rx="180" ry="120" fill="#9b5cff" opacity="0.35"/>
  </g>

  <!-- Incoming white beam -->
  <polygon points="0,372 610,300 610,318 0,392" fill="url(#beam)" filter="url(#edge)"/>
  <polygon points="200,358 610,302 610,316 200,374" fill="#ffffff" opacity="0.35" filter="url(#soft)"/>

  <!-- Spectrum fanning out of the prism -->
  <g mask="url(#fadeMask)" style="mix-blend-mode:screen">
    <g filter="url(#soft)" opacity="0.9">
      <polygon points="690,296 1200,96 1200,170 690,302" fill="#ff2d55"/>
      <polygon points="690,302 1200,170 1200,244 690,308" fill="#ff8a00"/>
      <polygon points="690,308 1200,244 1200,318 690,314" fill="#ffd400"/>
      <polygon points="690,314 1200,318 1200,392 690,320" fill="#2bff88"/>
      <polygon points="690,320 1200,392 1200,466 690,326" fill="#00d4ff"/>
      <polygon points="690,326 1200,466 1200,540 690,332" fill="#3d6bff"/>
      <polygon points="690,332 1200,540 1200,614 690,338" fill="#a64dff"/>
    </g>
    <!-- Crisp highlights along the band edges -->
    <g opacity="0.35" stroke="#ffffff" stroke-width="1.2" fill="none">
      <line x1="690" y1="302" x2="1200" y2="170"/>
      <line x1="690" y1="314" x2="1200" y2="318"/>
      <line x1="690" y1="326" x2="1200" y2="466"/>
    </g>
  </g>

  <!-- The prism -->
  <g>
    <polygon points="650,150 760,420 540,420" fill="url(#glass)"/>
    <polygon points="650,150 760,420 540,420" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="2"/>
    <!-- Inner refraction path through the glass -->
    <polygon points="610,300 690,296 690,338 610,318" fill="#ffffff" opacity="0.35" filter="url(#edge)"/>
    <!-- Specular glints -->
    <line x1="650" y1="158" x2="582" y2="330" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="650" cy="152" r="5" fill="#ffffff"/>
    <circle cx="650" cy="152" r="26" fill="#ffffff" opacity="0.25" filter="url(#soft)"/>
  </g>

  <!-- Holographic sheen and fine diagonal lines, like foil -->
  <rect width="1200" height="760" fill="url(#sheen)" style="mix-blend-mode:screen"/>
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <line x1="-200" y1="760" x2="560" y2="0"/>
    <line x1="-120" y1="760" x2="640" y2="0"/>
    <line x1="-40" y1="760" x2="720" y2="0"/>
    <line x1="40" y1="760" x2="800" y2="0"/>
    <line x1="120" y1="760" x2="880" y2="0"/>
    <line x1="200" y1="760" x2="960" y2="0"/>
    <line x1="280" y1="760" x2="1040" y2="0"/>
    <line x1="360" y1="760" x2="1120" y2="0"/>
    <line x1="440" y1="760" x2="1200" y2="0"/>
    <line x1="520" y1="760" x2="1280" y2="0"/>
    <line x1="600" y1="760" x2="1360" y2="0"/>
  </g>

  <rect width="1200" height="760" filter="url(#grain)"/>
</svg>
